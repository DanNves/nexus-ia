<div class="app-shell">
<header class="navbar nexus-navbar"><div class="nav-inner nexus-nav-inner">
<button class="brand nexus-brand" (click)="navigate('/dashboard')" aria-label="NEXUS Dashboard"><img src="/nexus-logo.svg" alt="NEXUS"><span><strong>NEXUS</strong><small>CONEXÃO DE CONTEXTO</small></span></button>
<div class="nexus-nav-divider" aria-hidden="true"></div>
<nav class="nav-links nexus-primary-nav" aria-label="Navegação principal">
@for(item of navItems;track item[0]){<a class="nav-item nexus-nav-item" [routerLink]="item[1]" routerLinkActive="active" [routerLinkActiveOptions]="{exact:item[1]==='/dashboard'}" [attr.title]="item[0]" [attr.aria-label]="item[0]" (click)="mobileOpen=false"><nx-icon [name]="item[2]" [size]="16"/><span>{{item[0]}}</span></a>}
</nav>
<div class="nav-actions nexus-actions">
<button class="nav-create nexus-create" (click)="openWizard('demanda')" title="Nova demanda"><nx-icon name="plus" [size]="16"/><span>Nova demanda</span></button>
<button class="icon-btn nexus-action-btn" (click)="openSearch()" title="Pesquisar" aria-label="Pesquisar"><nx-icon name="search" [size]="18"/></button>
<div class="notification-wrap nexus-notification-wrap"><button class="icon-btn nexus-action-btn notify" [class.active]="notificationOpen" (click)="notificationOpen=!notificationOpen;userOpen=false" title="Notificações" aria-label="Notificações"><nx-icon name="bell" [size]="18"/>@if(store.pendingNotifications()>0){<i>{{store.pendingNotifications()>9?'9+':store.pendingNotifications()}}</i>}</button><nx-notification-menu [open]="notificationOpen" (closed)="notificationOpen=false" (recordSelected)="openRecord($event)"/></div>
<div class="user-wrap nexus-user-wrap"><button class="user-button nexus-user" (click)="userOpen=!userOpen;notificationOpen=false" aria-label="Menu do usuário"><span class="avatar">{{currentUser.name.charAt(0)}}</span><span class="user-copy"><strong>{{currentUser.name}}</strong><small>USUÁRIO</small></span><nx-icon name="arrow" [size]="11"/></button>@if(userOpen){<div class="user-menu"><strong>{{currentUser.name}}</strong><button (click)="navigate('/indicadores')"><nx-icon name="chart" [size]="14"/> Indicadores</button><button (click)="navigate('/configuracoes')"><nx-icon name="settings" [size]="14"/> Configurações</button></div>}</div>
</div>
<button class="mobile-toggle nexus-mobile-toggle" (click)="mobileOpen=!mobileOpen" [attr.aria-expanded]="mobileOpen" aria-label="Abrir menu"><nx-icon [name]="mobileOpen?'close':'menu'" [size]="20"/></button>
</div>
@if(mobileOpen){<div class="mobile-panel nexus-mobile-panel">@for(section of mobileSections;track section.label){<section class="mobile-nav-group"><span class="mobile-nav-label">{{section.label}}</span>@for(item of section.items;track item[0]){<a [routerLink]="item[1]" routerLinkActive="active" [routerLinkActiveOptions]="{exact:item[1]==='/dashboard'}" (click)="mobileOpen=false"><nx-icon [name]="item[2]" [size]="17"/><span>{{item[0]}}</span></a>}</section>}<button class="mobile-create" (click)="openWizard('demanda')"><nx-icon name="plus"/> Nova demanda</button></div>}
</header>
<main class="content"><router-outlet/></main>
@if(store.feedback();as message){<div class="toast" role="status"><nx-icon name="check" [size]="15"/>{{message}}</div>}
<nx-global-search [open]="searchOpen" (closed)="closeSearch()"/>
<nx-detail-drawer (closed)="closeDetail()"/>
<nx-wizard (closed)="closeWizard()"/>
</div>
