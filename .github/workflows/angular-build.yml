name: Angular build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static quality gate
        run: npm run check

      - name: Build production
        run: npm run build

      - name: Verify Angular output
        run: |
          test -f dist/nexus-ia/browser/index.html
          test -f dist/nexus-ia/browser/favicon.svg
          echo "Angular output verified at frontend/dist/nexus-ia/browser"
